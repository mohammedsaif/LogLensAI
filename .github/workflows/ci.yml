name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests eval
          ruff format --check app
      - name: Tests (mocked AI) with coverage
        run: pytest -q --cov=app --cov-report=term --cov-report=xml --cov-fail-under=90
        env:
          AI_PROVIDER: mock
      - name: Offline evaluation (critical-signal recall must be 100%)
        run: python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/eval/results/

  migrations:
    name: Alembic on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loglens
          POSTGRES_USER: loglens
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loglens" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://loglens:ci-only-password@localhost:5432/loglens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: API smoke test against PostgreSQL
        run: |
          uvicorn app.main:create_app --factory --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && break; sleep 1; done
          ID=$(curl -sf -X POST localhost:8000/api/v1/samples/analyze -H 'Content-Type: application/json' -d '{"scenario":"pool_exhaustion","lines":1000}' | python -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          sleep 3
          curl -sf localhost:8000/api/v1/analyses/$ID | python -c 'import sys,json;d=json.load(sys.stdin);assert d["status"]=="completed",d["status"];assert "L120" in d["summary_lines"][2];print("ok")'

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          BACKEND_PYTHON: python
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loglens-backend:ci backend
      - run: docker build -t loglens-frontend:ci frontend
